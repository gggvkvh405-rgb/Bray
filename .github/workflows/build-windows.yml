name: Build Windows portable app

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python for local Piper runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build local Piper runtime and include license notices
        shell: pwsh
        run: ./scripts/build-piper-runtime.ps1
      - name: Install dependencies
        run: npm ci
      - name: Build portable executable
        run: npm run dist:win
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ByAzen-Windows-x64
          path: release/ByAzen.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct download
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/f944c286-bray'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.26 release/ByAzen.exe --repo gggkvkvh405-rgb/Bray

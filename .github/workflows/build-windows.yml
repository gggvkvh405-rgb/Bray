name: Build Windows portable app

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Python for local Piper runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build local Piper runtime and include license notices
        shell: pwsh
        run: ./scripts/build-piper-runtime.ps1
      - name: Install dependencies
        run: npm ci
      - name: Build portable executable
        run: npm run dist:win
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ByAzen-Windows-x64
          path: release/ByAzen.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct download
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/f944c286-bray'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.24 --repo gggkvh405-rgb/Bray >/dev/null 2>&1; then
            gh release upload v1.0.24 release/ByAzen.exe --clobber --repo gggkvh405-rgb/Bray
          else
            gh release create v1.0.24 release/ByAzen.exe \
              --title 'ByAzen 1.0.24 — Поиск и запуск' \
              --notes 'Windows x64 build: improves engine-specific search suggestions, local query history, search result pagination and parsing; adds a polished animated startup icon. Includes the v1.0.22 visual refresh and v1.0.23 pet-control fix.' \
              --prerelease \
              --repo gggvkvh405-rgb/Bray
          fi

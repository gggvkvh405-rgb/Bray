name: Build Windows portable app

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build portable executable
        run: npm run dist:win
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ByAzen-Windows-x64
          path: release/ByAzen.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct download
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/f944c286-bray'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.18 --repo gggvkvh405-rgb/Bray >/dev/null 2>&1; then
            gh release upload v1.0.18 release/ByAzen.exe --clobber --repo gggvkvh405-rgb/Bray
          else
            gh release create v1.0.18 release/ByAzen.exe \
              --title 'ByAzen 1.0.18 — поиск, загрузки и звук вкладок' \
              --notes 'Windows x64 build: in-page search with match navigation and counts, Ctrl+F from web pages, session download manager with progress/cancel/open/reveal/clear actions, and per-tab audio mute controls.' \
              --prerelease \
              --repo gggvkvh405-rgb/Bray
          fi
